{{- if .Values.postgis.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: productive-k3s
type: Opaque
data:
  postgres-password: {{ .Values.postgis.auth.postgresPassword | b64enc | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgis-initdb
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: productive-k3s
data:
  00-postgis.sql: |
    CREATE EXTENSION IF NOT EXISTS postgis;
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql-hl
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: productive-k3s
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: productive-k3s
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: productive-k3s
spec:
  serviceName: {{ .Release.Name }}-postgresql-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: productive-k3s
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgis.image.repository }}:{{ .Values.postgis.image.tag }}"
          imagePullPolicy: {{ .Values.postgis.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          emptyDir: {}
        - name: initdb
          configMap:
            name: {{ .Release.Name }}-postgis-initdb
{{- end }}
