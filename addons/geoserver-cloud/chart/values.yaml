rabbitmq:
  enabled: true
  image:
    repository: bitnamilegacy/rabbitmq
    tag: 3.12.14-debian-12-r0
    digest: sha256:24e748a477f926ac4141fff8d6730951958e847a2d075f9973dfd977abdcef52
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
      tag: 12-debian-12-r22
      digest: sha256:61a67d35734fded998f199db762b88a1004abad115acb6ca473a7ef82dc3d31a
  auth:
    username: geoserver
    password: password
    erlangCookie: cookie
