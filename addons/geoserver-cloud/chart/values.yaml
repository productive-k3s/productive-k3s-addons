geoservercloud:
  global:
    profile: standalone,pgconfig,acl
    image:
      pullPolicy: IfNotPresent
  geoserver:
    ingress:
      enabled: false
    services:
      gateway:
        enabled: true
        ingress:
          enabled: false
          path: /geoserver/
        containers:
          spring:
            image:
              sha: de0b20bd2a4393bac7b9923e63f6e03611648bd749834434f170e9bfc9c0e47d
            resources: &gscloud-resources
              requests:
                cpu: 100m
                memory: 384Mi
              limits:
                cpu: 750m
                memory: 1Gi
            env: &gscloud-env
              GEOSERVER_BASE_PATH:
                value: /geoserver
              SPRING_PROFILES_ACTIVE:
                value: standalone,pgconfig,acl
              SPRING_CONFIG_ADDITIONAL_LOCATION:
                value: optional:file:/etc/gscloud-custom/jndi.yml,optional:file:/etc/gscloud-custom/values.yml
              GWC_ENABLED:
                value: "true"
              SPRING_CLOUD_BUS_ENABLED:
                value: "false"
              WCS_ENABLED:
                value: "false"
              GEOWEBCACHE_CACHE_DIR:
                value: /tmp/geowebcache
              JAVA_OPTS:
                order: 1
                value: "$(JAVA_OPTS_DEFAULT) -XshowSettings:system"
              RABBITMQ_HOST:
                value: geoserver-cloud-rabbitmq
              RABBITMQ_PORT:
                value: "5672"
              RABBITMQ_USER:
                value: geoserver
              RABBITMQ_PASSWORD:
                value: password
              PG_PASSWORD:
                value: g30s3rv3r
              ACL_URL:
                value: http://geoserver-cloud-gsc-acl:8080/acl/api
              ACL_USERNAME:
                value: admin
              ACL_PASSWORD:
                value: geoserver
              PGCONFIG_HOST:
                value: geoserver-cloud-postgresql-hl
              PGCONFIG_PORT:
                value: "5432"
              PGCONFIG_DATABASE:
                value: postgres
              PGCONFIG_SCHEMA:
                value: pgconfig
              PGCONFIG_USERNAME:
                value: postgres
              PGCONFIG_PASSWORD:
                value: g30s3rv3r
              PGCONFIG_MAXCONNECTIONS:
                value: "10"
      webui:
        enabled: true
        containers:
          spring:
            image:
              sha: 4f91e3048ac894a476a1e84c2a018d2fb8e9d933fb88d1a6556386bdc2bf1bde
            resources: *gscloud-resources
            env: *gscloud-env
      rest:
        enabled: true
        containers:
          spring:
            image:
              sha: 318254b52f967de74ffbef8efcf1f7d8cf81035e6b8145ea5d42d6e8a65fd301
            resources: *gscloud-resources
            env: *gscloud-env
      wms:
        enabled: true
        containers:
          spring:
            image:
              sha: 5164f687ce4d853690802e304022ce540e4f0144a08e88d63112fa2da84fa1f7
            resources: *gscloud-resources
            env: *gscloud-env
      wfs:
        enabled: true
        containers:
          spring:
            image:
              sha: 299f0d6232d1aa7a94afce0394fa8d5465e03b3f890b445c7876a62d55259ddc
            resources: *gscloud-resources
            env: *gscloud-env
      wcs:
        enabled: false
        containers:
          spring:
            image:
              sha: 4f077124f59154ba60b110466776cd4bd2aafabf7738a26e958b8c92d4af376d
      wps:
        enabled: false
        containers:
          spring:
            image:
              sha: 0b41bd2c9a76cc0bc9e7f21294472026597c41dd1a0b1bac1aa758b9c6ed53fb
      gwc:
        enabled: true
        containers:
          spring:
            image:
              sha: b04ed89b5d2b0ce41cc50dabe0250dcdf1368b6c65f9ad81bc239695700fe794
            resources: *gscloud-resources
            env: *gscloud-env
      acl:
        enabled: true
        containers:
          spring:
            image:
              sha: 6f42d4139cb0270120fd06ad61d4c3e7cc01daf318c372774a8814c5bea636f4
            resources: *gscloud-resources
            env:
              GEOSERVER_BUS_ENABLED:
                value: "false"
              SPRING_CLOUD_BUS_ENABLED:
                value: "false"
              RABBITMQ_HOST:
                value: geoserver-cloud-rabbitmq
              RABBITMQ_PORT:
                value: "5672"
              RABBITMQ_USER:
                value: geoserver
              RABBITMQ_PASSWORD:
                value: password
              PG_HOST:
                value: geoserver-cloud-postgresql-hl
              PG_PORT:
                value: "5432"
              PG_DB:
                value: postgres
              PG_SCHEMA:
                value: acl
              PG_USERNAME:
                value: postgres
              PG_PASSWORD:
                value: g30s3rv3r
              ACL_USERS_ADMIN_PASSWORD:
                value: geoserver
              ACL_USERS_GEOSERVER_PASSWORD:
                value: geoserver
