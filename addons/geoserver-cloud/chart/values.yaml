postgis:
  enabled: true
  image:
    repository: postgis/postgis
    tag: 16-3.4-alpine
    digest: sha256:681931a625df344215e9b8998bf34daf146b6a395ceacee4439eb9c85869239f
    pullPolicy: IfNotPresent
