apiVersion: addons.productive-k3s.io/v1
kind: Addon
metadata:
  name: kyverno
  version: 0.1.0
  category: security
spec:
  type: helm
  impact:
    cluster: true
    host: false
    summary: "Installs Kyverno with a minimal Productive K3S policy set in Audit mode."
  configure:
    script: scripts/configure.sh
  install:
    script: scripts/install.sh
  validate:
    script: scripts/validate.sh
  clean:
    script: scripts/clean.sh
  backup:
    script: scripts/backup.sh
