apiVersion: addons.productive-k3s.io/v1
kind: Addon
metadata:
  name: cloudnative-pg
  version: 0.1.0
  category: database
spec:
  type: helm
  impact:
    cluster: true
    host: false
    summary: "Installs the CloudNativePG operator and can create a modest PostgreSQL cluster using the selected StorageClass."
  configure:
    script: scripts/configure.sh
  install:
    script: scripts/install.sh
  validate:
    script: scripts/validate.sh
  clean:
    script: scripts/clean.sh
  backup:
    script: scripts/backup.sh
