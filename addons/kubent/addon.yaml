apiVersion: addons.productive-k3s.io/v1
kind: Addon
metadata:
  name: kubent
  version: 0.1.0
  sourceRevision: development
  category: operations
spec:
  compatibility:
    requires:
      core:
        contract: artifact/v1
        minVersion: 0.9.6
        maxVersionExclusive: 0.10.0
      kubernetes:
        distros:
          - k3s
          - rke2
  type: shell
  impact:
    cluster: true
    host: false
    summary: "Runs Kube No Trouble as a read-only deprecated Kubernetes API detection Job."
  configure:
    script: scripts/configure.sh
  install:
    script: scripts/install.sh
  validate:
    script: scripts/validate.sh
  clean:
    script: scripts/clean.sh
  backup:
    script: scripts/backup.sh
