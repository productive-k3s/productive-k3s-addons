apiVersion: addons.productive-k3s.io/v1
kind: Addon
metadata:
  name: cert-manager
  version: 0.1.0
  sourceRevision: development
  category: platform
spec:
  compatibility:
    requires:
      core:
        contract: artifact/v1
        minVersion: 0.9.6
        maxVersionExclusive: 0.10.0
      kubernetes:
        distros:
          - k3s
          - rke2
  type: shell
  impact:
    cluster: true
    host: false
    summary: "Installs cert-manager and manages ClusterIssuer resources for TLS-enabled add-ons."
  configure:
    script: scripts/configure.sh
  install:
    script: scripts/install.sh
  productiveK3s:
    stack:
      runtime:
        inputs:
          - name: PK3S_CERT_MANAGER_VERSION
            source: PRODUCTIVE_K3S_CERT_MANAGER_VERSION
          - name: PK3S_CLUSTER_ISSUER_ACTION
            valueFrom: core.clusterIssuerAction
          - name: PK3S_TLS_SOURCE
            valueFrom: core.tlsSource
          - name: PK3S_CLUSTER_ISSUER
            source: ISSUER_NAME
          - name: PK3S_LETSENCRYPT_EMAIL
            source: LE_EMAIL
          - name: PK3S_LETSENCRYPT_ENVIRONMENT
            source: LE_ENV
  validate:
    script: scripts/validate.sh
  clean:
    script: scripts/clean.sh
  backup:
    script: scripts/backup.sh
