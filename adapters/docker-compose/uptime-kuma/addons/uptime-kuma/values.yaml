applicationName: uptime-kuma
deployment:
  enabled: true
  replicas: 1
  image:
    repository: louislam/uptime-kuma
    tag: '2'
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  ports:
  - name: port-3001
    containerPort: 3001
    protocol: TCP
service:
  enabled: true
  ports:
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
