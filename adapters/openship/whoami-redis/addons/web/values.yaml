applicationName: web
deployment:
  enabled: true
  replicas: 1
  image:
    repository: traefik/whoami
    tag: v1.10
    digest: sha256:1699d99cb4b9acc17f74ca670b3d8d0b7ba27c948b3445f0593b58ebece92f04
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  env:
    APP_ENV:
      value: production
    REDIS_HOST:
      value: cache
  ports:
  - name: port-80
    containerPort: 80
    protocol: TCP
service:
  enabled: true
  ports:
  - name: port-80
    port: 8080
    targetPort: 80
    protocol: TCP
