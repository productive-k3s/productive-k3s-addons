applicationName: dashboard
deployment:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/oblien/openship-dashboard
    digest: sha256:a2e67cd3b3db93b523b6065254429c3388c4584167ad1c00f36270bfe4397953
  containerSecurityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
  env:
    INTERNAL_API_URL:
      value: http://api:4000
    NODE_ENV:
      value: production
    OPENSHIP_PUBLIC_URL:
      value: http://localhost:3001
    PORT:
      value: '3001'
  ports:
  - name: port-3001
    containerPort: 3001
    protocol: TCP
service:
  enabled: true
  ports:
  - name: port-3001
    port: 3001
    targetPort: 3001
    protocol: TCP
